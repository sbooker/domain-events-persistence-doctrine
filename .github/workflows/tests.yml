name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Doctrine ORM ${{ matrix.orm }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            orm: '^2.7'
          - php: '8.0'
            orm: '^2.7'
          - php: '8.1'
            orm: '^2.7'
          - php: '8.2'
            orm: '^2.7'
          - php: '8.3'
            orm: '^2.7'
          - php: '8.1'
            orm: '^3.0'
          - php: '8.2'
            orm: '^3.0'
          - php: '8.3'
            orm: '^3.0'

    container:
      image: php:${{ matrix.php }}-cli

    services:
      pgsql11:
        image: postgres:11.5
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: user
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U user -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pgsql12:
        image: postgres:12
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: user
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U user -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql5:
        image: mysql/mysql-server:5.5
        env:
          MYSQL_DATABASE: test
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql8:
        image: mysql:8
        env:
          MYSQL_DATABASE: test
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install system dependencies and PHP extensions
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip libpq-dev
          docker-php-ext-install pdo_pgsql pdo_mysql

      - uses: actions/checkout@v4

      - name: Install Composer
        run: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Install dependencies (Doctrine ORM ${{ matrix.orm }})
        run: composer update --with "doctrine/orm:${{ matrix.orm }}" --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit --configuration .
